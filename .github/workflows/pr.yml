name: PR check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Generate (must match committed output)
        run: |
          npm run generate
          git diff --exit-code -- src/generated
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
