name: Release
# Manual release — trigger from Actions tab → Run workflow.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (skip remote version checks, publish + tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm >= 11.5.1 for trusted publishing
        # Runner-bundled npm can lag behind. Trusted publishing (OIDC) needs
        # 11.5.1+ to honour the id-token exchange; pin to latest to stay safe.
        run: npm install -g npm@latest
      - run: npm ci
      - name: Sync latest spec
        run: npm run sync-spec
      - name: Generate
        # Regenerate SDK + CLI from the freshly synced spec. Release runs do
        # not push to main; drift must be committed through a PR first.
        run: npm run generate
      - name: Verify committed release inputs
        run: git diff --exit-code -- spec/openapi.json src/generated package.json package-lock.json
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Check release version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "Tag v$VERSION already exists."
              exit 1
            fi
            if npm view "@wspc/cli@$VERSION" version >/dev/null 2>&1; then
              echo "@wspc/cli@$VERSION is already published."
              exit 1
            fi
          fi
      - name: Publish to npm
        # Auth happens via OIDC (npm Trusted Publishing) — no NODE_AUTH_TOKEN
        # needed. The `--provenance` flag attaches a signed attestation tying
        # the published tarball to this exact commit + workflow run. npm docs
        # claim provenance is automatic under trusted publishing, but real
        # usage reports show the flag is still required to actually emit it.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --dry-run
          else
            npm publish --provenance
          fi
      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -a "v$VERSION" -m "chore(release): $VERSION"
          git push origin "v$VERSION"
      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        run: gh release create "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
