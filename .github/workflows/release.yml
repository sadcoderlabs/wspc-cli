name: Release
# Manual release — trigger from Actions tab → Run workflow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Dry-run (skip publish + tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Sync latest spec
        run: npm run sync-spec
      - name: Generate and check drift
        run: |
          npm run generate
          git diff --exit-code -- src/generated || (echo "Generated drift detected"; exit 1)
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version
        run: npm version ${{ inputs.bump }} -m "chore(release): %s"
      - name: Publish to npm
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push tag
        if: ${{ inputs.dry_run != 'true' }}
        run: git push --follow-tags
      - name: GitHub release
        if: ${{ inputs.dry_run != 'true' }}
        run: gh release create "v$(node -p 'require("./package.json").version')" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
