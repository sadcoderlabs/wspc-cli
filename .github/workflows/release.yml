name: Release
# Manual release — trigger from Actions tab → Run workflow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Dry-run (skip publish + tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm >= 11.5.1 for trusted publishing
        # Runner-bundled npm can lag behind. Trusted publishing (OIDC) needs
        # 11.5.1+ to honour the id-token exchange; pin to latest to stay safe.
        run: npm install -g npm@latest
      - run: npm ci
      - name: Sync latest spec
        run: npm run sync-spec
      - name: Generate
        # Regenerate SDK + CLI from the freshly synced spec. Any drift is
        # committed below (before the version bump) so a spec-only update ships
        # via a plain release with no manual pre-commit. Typecheck/build/test
        # still run before publish, so a broken regen aborts the release.
        run: npm run generate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit spec + codegen drift (if any)
        # Self-heal the drift that "Sync latest spec" + "Generate" may have
        # produced, so a no-code-change release just works. No-op when the spec
        # was already current. Must run before `npm version` (needs clean tree).
        run: |
          # src/version.ts is gitignored (regenerated by sync-spec each run), so
          # it must NOT be added — only the tracked spec + generated SDK/CLI.
          git add spec/openapi.json src/generated
          if git diff --cached --quiet; then
            echo "No drift — spec already current."
          else
            git commit -m "chore(spec): sync upstream openapi + regen"
          fi
      - name: Bump version
        run: |
          npm version ${{ inputs.bump }} -m "chore(release): %s"
      - name: Publish to npm
        # Auth happens via OIDC (npm Trusted Publishing) — no NODE_AUTH_TOKEN
        # needed. The `--provenance` flag attaches a signed attestation tying
        # the published tarball to this exact commit + workflow run. npm docs
        # claim provenance is automatic under trusted publishing, but real
        # usage reports show the flag is still required to actually emit it.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --dry-run
          else
            npm publish --provenance
          fi
      - name: Push commits + tag
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags
      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        run: gh release create "v$(node -p 'require("./package.json").version')" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
